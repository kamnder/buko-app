name: Verify Firebase Service Account Key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_firebase_credentials.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private key matches service account
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.BUKO_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.BUKO_FIREBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CLIENT_EMAIL"
          test -n "$FIREBASE_PRIVATE_KEY"
          python3 - <<'PY'
          import os
          value = os.environ['FIREBASE_PRIVATE_KEY'].strip()
          if '\\n' in value:
              value = value.replace('\\n', '\n')
          if value.startswith('"') and value.endswith('"'):
              value = value[1:-1]
          open('/tmp/firebase-private-key.pem', 'w').write(value + ('\n' if not value.endswith('\n') else ''))
          print('PRIVATE_KEY_FORMAT=' + ('PEM' if value.startswith('-----BEGIN PRIVATE KEY-----') else 'UNKNOWN'))
          email = os.environ['FIREBASE_CLIENT_EMAIL'].strip()
          print('EMAIL_FORMAT_OK=' + str(email.endswith('.iam.gserviceaccount.com')))
          print('EMAIL_PROJECT_SUFFIX_OK=' + str(email.endswith('@buko-6f769.iam.gserviceaccount.com')))
          PY
          openssl pkey -in /tmp/firebase-private-key.pem -pubout -outform DER > /tmp/private-public.der
          PRIVATE_FP=$(sha256sum /tmp/private-public.der | awk '{print $1}')
          curl -fsS "https://www.googleapis.com/robot/v1/metadata/x509/${FIREBASE_CLIENT_EMAIL}" -o /tmp/certs.json
          python3 - <<'PY'
          import json, os, sys
          email = os.environ['FIREBASE_CLIENT_EMAIL'].strip()
          data = json.load(open('/tmp/certs.json'))
          cert = data.get(email)
          if not cert:
              print('SERVICE_ACCOUNT_CERT_NOT_FOUND')
              sys.exit(1)
          open('/tmp/service-account-cert.pem','w').write(cert)
          print('SERVICE_ACCOUNT_CERT_FOUND')
          PY
          openssl x509 -in /tmp/service-account-cert.pem -pubkey -noout | openssl pkey -pubin -outform DER > /tmp/google-public.der
          GOOGLE_FP=$(sha256sum /tmp/google-public.der | awk '{print $1}')
          echo "PRIVATE_KEY_PUBLIC_FINGERPRINT=$PRIVATE_FP"
          echo "GOOGLE_PUBLIC_FINGERPRINT=$GOOGLE_FP"
          if [ "$PRIVATE_FP" != "$GOOGLE_FP" ]; then
            echo 'KEY_MATCH=false'
            exit 1
          fi
          echo 'KEY_MATCH=true'

# Re-run verification after Firebase credential refresh
