name: Verify Firebase Service Account Key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_firebase_credentials.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Firebase service account credentials
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.BUKO_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.BUKO_FIREBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CLIENT_EMAIL"
          test -n "$FIREBASE_PRIVATE_KEY"
          python3 - <<'PY'
          import os
          value = os.environ['FIREBASE_PRIVATE_KEY'].strip()
          if '\\n' in value:
              value = value.replace('\\n', '\n')
          if value.startswith('"') and value.endswith('"'):
              value = value[1:-1]
          if not value.startswith('-----BEGIN PRIVATE KEY-----') or '-----END PRIVATE KEY-----' not in value:
              raise SystemExit('PRIVATE_KEY_FORMAT_INVALID')
          open('/tmp/firebase-private-key.pem', 'w').write(value + ('\n' if not value.endswith('\n') else ''))
          email = os.environ['FIREBASE_CLIENT_EMAIL'].strip()
          if not email.endswith('@buko-6f769.iam.gserviceaccount.com'):
              raise SystemExit('CLIENT_EMAIL_PROJECT_MISMATCH')
          print('PRIVATE_KEY_FORMAT=PEM')
          print('EMAIL_FORMAT_OK=True')
          print('EMAIL_PROJECT_SUFFIX_OK=True')
          PY
          openssl pkey -in /tmp/firebase-private-key.pem -check -noout
          openssl pkey -in /tmp/firebase-private-key.pem -pubout -outform DER >/tmp/firebase-public.der
          FP=$(sha256sum /tmp/firebase-public.der | awk '{print $1}')
          echo "PRIVATE_KEY_PUBLIC_FINGERPRINT=$FP"
          echo 'KEY_PARSE_OK=true'

# Firebase custom-token exchange is verified by the deployed Worker self-test, not by the public certificate metadata endpoint.
