name: Consolidate BUKO final fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_modern_car_cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Main page: reliable WhatsApp deep-link with browser fallback and a visible WhatsApp button.
          p = Path('lib/main.dart')
          s = p.read_text()
          start = s.index('Future<void> _openBukoWhatsApp')
          end = s.index('\n\nFuture<void> main()', start)
          helper = '''Future<void> _openBukoWhatsApp(BuildContext context) async {
            const phone = '249909976346';
            final text = Uri.encodeComponent('مرحباً BUKO، أريد الاستعلام عن السيارات المعروضة.');
            final appUri = Uri.parse('whatsapp://send?phone=$phone&text=$text');
            final webUri = Uri.parse('https://wa.me/$phone?text=$text');
            try {
              if (await launchUrl(appUri, mode: LaunchMode.externalApplication)) return;
              if (await launchUrl(webUri, mode: LaunchMode.externalApplication)) return;
            } catch (_) {}
            if (context.mounted) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('تعذر فتح واتساب. سيتم فتح الرابط عبر المتصفح.')),
              );
            }
          }'''
          s = s[:start] + helper + s[end:]

          old = "Row(mainAxisSize: MainAxisSize.min, children: [IconButton(tooltip: 'استعلام واتساب', onPressed: () => _openBukoWhatsApp(context), icon: const Icon(Icons.chat_rounded, color: Color(0xFF25D366))), IconButton(tooltip: 'الإشعارات', onPressed: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('لا توجد إشعارات جديدة'))), icon: const Icon(Icons.notifications_none_rounded))])"
          new = "Row(mainAxisSize: MainAxisSize.min, children: [Material(color: const Color(0xFF25D366), borderRadius: BorderRadius.circular(14), child: InkWell(onTap: () => _openBukoWhatsApp(context), borderRadius: BorderRadius.circular(14), child: const Padding(padding: EdgeInsets.symmetric(horizontal: 10, vertical: 8), child: Row(mainAxisSize: MainAxisSize.min, children: [Icon(Icons.chat_rounded, color: Colors.white, size: 20), SizedBox(width: 5), Text('واتساب', style: TextStyle(color: Colors.white, fontWeight: FontWeight.w800, fontSize: 12))])))), const SizedBox(width: 4), IconButton(tooltip: 'الإشعارات', onPressed: () => ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('لا توجد إشعارات جديدة'))), icon: const Icon(Icons.notifications_none_rounded))])"
          if old not in s:
              raise SystemExit('WhatsApp top bar marker not found')
          s = s.replace(old, new, 1)
          # Safety: never allow accidental duplicated card class names.
          s = s.replace('ModernModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('ModernModernCarCard(', 'ModernCarCard(')
          p.write_text(s)

          # Admin page: add explicit accept/reject review controls for pending ads.
          p = Path('lib/admin_posts_page.dart')
          s = p.read_text()
          if 'Future<void> _review(' not in s:
              marker = '  Future<void> _status(String id, String value) async {'
              review = '''  Future<void> _review(String id, String value) async {
              if (busy) return;
              setState(() => busy = true);
              try {
                await db.collection('cars').doc(id).update({
                  'status': value,
                  'reviewedAt': FieldValue.serverTimestamp(),
                  'updatedAt': FieldValue.serverTimestamp(),
                });
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(content: Text(value == 'approved' ? 'تم قبول المراجعة ونشر الإعلان ✓' : 'تم رفض الإعلان وعدم نشره')),
                  );
                }
              } catch (e) {
                if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تعذر تنفيذ المراجعة: $e')));
              } finally {
                if (mounted) setState(() => busy = false);
              }
            }

'''
              if marker not in s:
                  raise SystemExit('Admin status marker not found')
              s = s.replace(marker, review + marker, 1)

          marker = '''                        const SizedBox(height: 10),
                        Wrap(
                          spacing: 8,'''
          if "'بانتظار المراجعة'" not in s:
              replacement = '''                        if ((data['status'] ?? 'pending').toString() == 'pending') ...[
                          Container(
                            margin: const EdgeInsets.only(bottom: 10),
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              color: _gold.withOpacity(.08),
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: _gold.withOpacity(.25)),
                            ),
                            child: Wrap(
                              crossAxisAlignment: WrapCrossAlignment.center,
                              spacing: 8,
                              runSpacing: 8,
                              children: [
                                const Row(mainAxisSize: MainAxisSize.min, children: [
                                  Icon(Icons.rate_review_outlined, color: _gold, size: 20),
                                  SizedBox(width: 7),
                                  Text('بانتظار المراجعة', style: TextStyle(fontWeight: FontWeight.w800)),
                                ]),
                                FilledButton.icon(
                                  onPressed: busy ? null : () => _review(doc.id, 'approved'),
                                  icon: const Icon(Icons.check, size: 18),
                                  label: const Text('قبول المراجعة'),
                                ),
                                OutlinedButton.icon(
                                  onPressed: busy ? null : () => _review(doc.id, 'rejected'),
                                  icon: const Icon(Icons.close, size: 18),
                                  label: const Text('عدم قبول'),
                                ),
                              ],
                            ),
                          ),
                        ],
                        const SizedBox(height: 10),
                        Wrap(
                          spacing: 8,'''
              if marker not in s:
                  raise SystemExit('Admin button marker not found')
              s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY

      - name: Validate source
        run: |
          set -euo pipefail
          grep -n "ModernCarCard" lib/main.dart
          grep -n "249909976346" lib/main.dart
          grep -n "_review" lib/admin_posts_page.dart

      - name: Commit source fixes once
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart lib/admin_posts_page.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize WhatsApp and admin review controls'
          git push
