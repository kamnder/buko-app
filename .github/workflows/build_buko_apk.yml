name: Build BUKO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create a clean Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.buko .

      - name: Configure Android package and build
        run: |
          # Keep the Kotlin DSL files generated by the current Flutter toolchain.
          # The previous workflow deleted app/build.gradle.kts, leaving Gradle with
          # no :app project and causing: Task 'assembleRelease' not found.
          sed -i 's/namespace = "com\.buko\.buko"/namespace = "com.buko.app"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com\.buko\.buko"/applicationId = "com.buko.app"/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/buko/app
          sed 's/^package com\.buko\.buko$/package com.buko.app/' \
            android/app/src/main/kotlin/com/buko/buko/MainActivity.kt \
            > android/app/src/main/kotlin/com/buko/app/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/buko/buko
          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Remove unused math import
        run: sed -i -E "/import 'dart:math'( as math)?;/d" lib/main.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUKO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
