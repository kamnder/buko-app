name: Verify Firebase Service Account Key

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify_firebase_credentials.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private key matches service account
        env:
          FIREBASE_CLIENT_EMAIL: ${{ secrets.BUKO_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.BUKO_FIREBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_CLIENT_EMAIL"
          test -n "$FIREBASE_PRIVATE_KEY"
          printf '%s' "$FIREBASE_PRIVATE_KEY" | sed 's/\\\\n/\n/g' > /tmp/firebase-private-key.pem
          openssl pkey -in /tmp/firebase-private-key.pem -pubout -outform DER 2>/dev/null > /tmp/private-public.der
          PRIVATE_FP=$(sha256sum /tmp/private-public.der | awk '{print $1}')
          EMAIL_URL=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["FIREBASE_CLIENT_EMAIL"], safe=""))')
          curl -fsS "https://www.googleapis.com/service_accounts/v1/metadata/x509/${EMAIL_URL}" -o /tmp/certs.json
          python3 - <<'PY'
          import json, os, sys
          email = os.environ['FIREBASE_CLIENT_EMAIL']
          data = json.load(open('/tmp/certs.json'))
          cert = data.get(email)
          if not cert:
              print('SERVICE_ACCOUNT_CERT_NOT_FOUND')
              print('EMAIL_SUFFIX_OK=' + str(email.endswith('@buko-6f769.iam.gserviceaccount.com')))
              sys.exit(1)
          open('/tmp/service-account-cert.pem','w').write(cert)
          print('SERVICE_ACCOUNT_CERT_FOUND')
          print('EMAIL_SUFFIX_OK=' + str(email.endswith('@buko-6f769.iam.gserviceaccount.com')))
          PY
          openssl x509 -in /tmp/service-account-cert.pem -pubkey -noout 2>/dev/null | openssl pkey -pubin -outform DER 2>/dev/null > /tmp/google-public.der
          GOOGLE_FP=$(sha256sum /tmp/google-public.der | awk '{print $1}')
          echo "PRIVATE_KEY_PUBLIC_FINGERPRINT=$PRIVATE_FP"
          echo "GOOGLE_PUBLIC_FINGERPRINT=$GOOGLE_FP"
          if [ "$PRIVATE_FP" != "$GOOGLE_FP" ]; then
            echo 'KEY_MATCH=false'
            exit 1
          fi
          echo 'KEY_MATCH=true'
