name: Deploy BUKO Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy_firebase_functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Verify Google credentials
        run: |
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          node -e "const fs=require('fs'); const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(!j.client_email || !j.private_key || !j.project_id) process.exit(1); console.log('Service account JSON is valid for project:', j.project_id);"

      - name: Deploy phone/password function
        run: firebase deploy --only functions:phonePasswordAuth --project buko-6f769 --non-interactive
