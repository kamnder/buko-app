name: Build BUKO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# FINAL BUILD — clean card wiring, backend verified, phone/password only, Cloudinary images, animated UI, admin.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.buko .
          sed -i 's/namespace = "com\.buko\.buko"/namespace = "com.buko.app"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com\.buko\.buko"/applicationId = "com.buko.app"/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/buko/app
          sed 's/^package com\.buko\.buko$/package com.buko.app/' android/app/src/main/kotlin/com/buko/buko/MainActivity.kt > android/app/src/main/kotlin/com/buko/app/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/buko/buko

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Apply final app fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Normalize the modern car card reference safely.
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('ModernModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('ModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('...docs.map((doc) => CarCard(', '...docs.map((doc) => ModernCarCard(')

          # Make WhatsApp launch the installed app first, then fall back to web.
          pattern = r"Future<void> _openBukoWhatsApp\(BuildContext context\) async \{.*?\n\}"
          replacement = '''Future<void> _openBukoWhatsApp(BuildContext context) async {
            const phone = '249909976346';
            final message = Uri.encodeComponent('مرحباً BUKO، أريد الاستعلام عن السيارات المعروضة.');
            final appUri = Uri.parse('whatsapp://send?phone=$phone&text=$message');
            final webUri = Uri.parse('https://wa.me/$phone?text=$message');
            try {
              if (await canLaunchUrl(appUri)) {
                await launchUrl(appUri, mode: LaunchMode.externalApplication);
                return;
              }
              if (await canLaunchUrl(webUri)) {
                await launchUrl(webUri, mode: LaunchMode.externalApplication);
                return;
              }
            } catch (_) {}
            if (context.mounted) {
              ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تعذر فتح واتساب. تأكد من تثبيت واتساب أو وجود متصفح.')));
            }
          }'''
          s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('WhatsApp helper not found')

          old_ui = "IconButton(tooltip: 'استعلام واتساب', onPressed: () => _openBukoWhatsApp(context), icon: const Icon(Icons.chat_rounded, color: Color(0xFF25D366))),"
          new_ui = '''FilledButton.icon(
              onPressed: () => _openBukoWhatsApp(context),
              style: FilledButton.styleFrom(
                backgroundColor: const Color(0xFF25D366),
                foregroundColor: Colors.white,
                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 10),
                shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
              ),
              icon: const Icon(Icons.chat_rounded, size: 21),
              label: const Text('واتساب', style: TextStyle(fontWeight: FontWeight.w800)),
            ),'''
          if old_ui in s:
              s = s.replace(old_ui, new_ui, 1)
          p.write_text(s)

          # Add accept/reject review controls to the admin advertisements page.
          p = Path('lib/admin_posts_page.dart')
          s = p.read_text()
          marker = "  Future<void> _status(String id, String value) async {"
          if 'Future<void> _review(' not in s:
              review = '''  Future<void> _review(String id, String value) async {
            if (busy) return;
            setState(() => busy = true);
            try {
              await db.collection('cars').doc(id).update({
                'status': value,
                'reviewedAt': FieldValue.serverTimestamp(),
                'updatedAt': FieldValue.serverTimestamp(),
              });
              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text(value == 'approved' ? 'تم قبول المراجعة ونشر الإعلان ✓' : 'تم عدم قبول المراجعة')),
                );
              }
            } catch (e) {
              if (mounted) ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('تعذر تنفيذ المراجعة: $e')));
            } finally {
              if (mounted) setState(() => busy = false);
            }
          }

'''
              if marker not in s:
                  raise SystemExit('Admin review method marker not found')
              s = s.replace(marker, review + marker, 1)

          if "'بانتظار المراجعة'" not in s:
              ui_marker = "                        const SizedBox(height: 10),\n                        Wrap(\n                          spacing: 8,"
              ui_new = '''                        if ('${data['status'] ?? 'pending'}' == 'pending') ...[
                          Container(
                            margin: const EdgeInsets.only(bottom: 10),
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              color: _gold.withOpacity(.08),
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: _gold.withOpacity(.25)),
                            ),
                            child: Wrap(
                              crossAxisAlignment: WrapCrossAlignment.center,
                              spacing: 6,
                              runSpacing: 6,
                              children: [
                                const Row(mainAxisSize: MainAxisSize.min, children: [Icon(Icons.rate_review_outlined, color: _gold, size: 20), SizedBox(width: 7), Text('بانتظار المراجعة', style: TextStyle(fontWeight: FontWeight.w800))]),
                                FilledButton.icon(onPressed: busy ? null : () => _review(doc.id, 'approved'), icon: const Icon(Icons.check, size: 18), label: const Text('قبول المراجعة')),
                                OutlinedButton.icon(onPressed: busy ? null : () => _review(doc.id, 'rejected'), icon: const Icon(Icons.close, size: 18), label: const Text('عدم قبول')),
                              ],
                            ),
                          ),
                        ],
                        const SizedBox(height: 10),
                        Wrap(
                          spacing: 8,'''
              if ui_marker not in s:
                  raise SystemExit('Admin review UI marker not found')
              s = s.replace(ui_marker, ui_new, 1)
          p.write_text(s)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Resolve auth endpoint
        env:
          BUKO_AUTH_ENDPOINT: ${{ secrets.BUKO_AUTH_ENDPOINT }}
        run: |
          set -euo pipefail
          AUTH_ENDPOINT="${BUKO_AUTH_ENDPOINT:-https://buko-auth-worker.buko-auth.workers.dev}"
          printf '%s' "$AUTH_ENDPOINT" | grep -Eq '^https://[^[:space:]]+$'
          echo "BUKO_AUTH_ENDPOINT=$AUTH_ENDPOINT" >> "$GITHUB_ENV"

      - name: Configure and validate Firebase API key
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_API_KEY"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('lib/firebase_options.dart')
          s = p.read_text()
          key = os.environ['FIREBASE_API_KEY'].strip()
          import re
          s, count = re.subn(r"apiKey:\s*'[^']*'", "apiKey: '" + key.replace("'", "\\'") + "'", s, count=1)
          if count != 1:
              raise SystemExit('firebase apiKey field not found')
          p.write_text(s)
          PY
          RESPONSE=$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${FIREBASE_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary '{"token":"BUKO_INVALID_TEST_TOKEN","returnSecureToken":true}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q 'INVALID_CUSTOM_TOKEN'

      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo 'Missing required GitHub secret: FIREBASE_SERVICE_ACCOUNT'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 -m json.tool "$RUNNER_TEMP/firebase-service-account.json" >/dev/null
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project buko-6f769 --non-interactive
          echo 'Firestore rules and indexes deployment completed successfully.'
          rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Build release APK
        env:
          BUKO_CLOUDINARY_CLOUD_NAME: uumd88s2
        run: |
          set -euo pipefail
          test -n "$BUKO_CLOUDINARY_CLOUD_NAME"
          flutter build apk --release \
            --dart-define=BUKO_AUTH_ENDPOINT="$BUKO_AUTH_ENDPOINT" \
            --dart-define=BUKO_CLOUDINARY_CLOUD_NAME="$BUKO_CLOUDINARY_CLOUD_NAME" \
            --dart-define=BUKO_CLOUDINARY_UPLOAD_PRESET="buko_cars"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUKO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
