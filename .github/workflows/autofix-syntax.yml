name: BUKO one-time syntax fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix unmatched parenthesis
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          old = "onPost: (car) => setState(() => cars.insert(0, car))));"
          new = "onPost: (car) => setState(() => cars.insert(0, car)))));"
          if old not in s:
              raise SystemExit('Target syntax was not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m "Fix remaining parenthesis in admin navigation"
          git push origin HEAD:main
      - name: Remove one-time fixer
        if: success()
        shell: bash
        run: |
          git pull --rebase origin main
          git rm .github/workflows/autofix-syntax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time syntax fixer"
          git push origin HEAD:main
