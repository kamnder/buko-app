name: Deploy BUKO Auth Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auth-worker/**'
      - '.github/workflows/deploy_auth_worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Wrangler
        run: npm install -g wrangler
      - name: Validate required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.BUKO_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.BUKO_FIREBASE_PRIVATE_KEY }}
          ADMIN_BOOTSTRAP_SECRET: ${{ secrets.BUKO_ADMIN_BOOTSTRAP_SECRET }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          check_secret() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "MISSING_SECRET:$name"
              missing=1
            else
              echo "SECRET_OK:$name"
            fi
          }
          check_secret CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          check_secret CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          check_secret BUKO_FIREBASE_CLIENT_EMAIL "$FIREBASE_CLIENT_EMAIL"
          check_secret BUKO_FIREBASE_PRIVATE_KEY "$FIREBASE_PRIVATE_KEY"
          check_secret BUKO_ADMIN_BOOTSTRAP_SECRET "$ADMIN_BOOTSTRAP_SECRET"
          check_secret FIREBASE_API_KEY "$FIREBASE_API_KEY"
          test "$missing" -eq 0
      - name: Create or find D1 database
        working-directory: auth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "buko-auth") | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create buko-auth --json > /tmp/d1.json
            DB_ID=$(jq -r '.database_id' /tmp/d1.json)
          fi
          test -n "$DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml
          echo "D1 database ready"
      - name: Configure Firebase public API key
        working-directory: auth-worker
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('wrangler.toml')
          s = p.read_text()
          key = os.environ['FIREBASE_API_KEY'].strip()
          s = s.replace('REPLACE_WITH_FIREBASE_WEB_API_KEY', key)
          p.write_text(s)
          PY
      - name: Store Firebase signing secrets in Worker
        working-directory: auth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.BUKO_FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.BUKO_FIREBASE_PRIVATE_KEY }}
          ADMIN_BOOTSTRAP_SECRET: ${{ secrets.BUKO_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          printf '%s' "$FIREBASE_CLIENT_EMAIL" | npx wrangler secret put FIREBASE_CLIENT_EMAIL
          printf '%s' "$FIREBASE_PRIVATE_KEY" | npx wrangler secret put FIREBASE_PRIVATE_KEY
          printf '%s' "$ADMIN_BOOTSTRAP_SECRET" | npx wrangler secret put ADMIN_BOOTSTRAP_SECRET
      - name: Apply D1 migrations
        working-directory: auth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply buko-auth --remote
      - name: Deploy Worker
        working-directory: auth-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
      - name: Verify Firebase custom-token exchange
        working-directory: auth-worker
        env:
          BUKO_ADMIN_BOOTSTRAP_SECRET: ${{ secrets.BUKO_ADMIN_BOOTSTRAP_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -X POST 'https://buko-auth-worker.buko-auth.workers.dev/auth/self-test' \
            -H 'Content-Type: application/json' \
            --data-binary "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'secret': os.environ['BUKO_ADMIN_BOOTSTRAP_SECRET']}))
          PY
          )")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true'

# Credential refresh verification trigger: redeploy Worker with refreshed Firebase service-account email.
