name: Apply BUKO home UI updates

on:
  push:
    branches: [main]
    paths:
      - 'lib/widgets/modern_car_card.dart'
      - 'lib/main.dart'
      - 'pubspec.yaml'
      - '.github/workflows/apply_modern_car_cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix and wire modern cards and WhatsApp inquiry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('ModernModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('ModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('CarCard(data:', 'ModernCarCard(data:')
          s = re.sub(r'class CarCard extends StatelessWidget \{.*?\n\}\n\nclass SellPage extends StatefulWidget \{', 'class SellPage extends StatefulWidget {', s, flags=re.S)
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Remove duplicate legacy car card class'
          git push
