name: Apply BUKO home UI updates

on:
  push:
    branches: [main]
    paths:
      - 'lib/widgets/modern_car_card.dart'
      - 'lib/main.dart'
      - 'pubspec.yaml'
      - '.github/workflows/apply_modern_car_cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize modern card wiring
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('ModernModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('ModernModernCarCard(', 'ModernCarCard(')
          s = s.replace('...docs.map((doc) => CarCard(', '...docs.map((doc) => ModernCarCard(')
          s = s.replace('class CarCard extends StatelessWidget {', 'class LegacyCarCard extends StatelessWidget {')
          s = s.replace('const ModernCarCard({super.key, required this.data, required this.id});', 'const LegacyCarCard({super.key, required this.data, required this.id});')
          p.write_text(s)
          PY

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git diff --cached --quiet && exit 0
          git commit -m 'Fix legacy card naming safely'
          git push
