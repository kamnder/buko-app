name: Build BUKO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Final integrated BUKO build: phone/password auth + Firebase + animated UI + admin.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          rm -rf android
          flutter create --platforms=android --org com.buko .
          sed -i 's/namespace = "com\.buko\.buko"/namespace = "com.buko.app"/' android/app/build.gradle.kts
          sed -i 's/applicationId = "com\.buko\.buko"/applicationId = "com.buko.app"/' android/app/build.gradle.kts
          mkdir -p android/app/src/main/kotlin/com/buko/app
          sed 's/^package com\.buko\.buko$/package com.buko.app/' android/app/src/main/kotlin/com/buko/buko/MainActivity.kt > android/app/src/main/kotlin/com/buko/app/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/buko/buko

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Resolve auth endpoint
        env:
          BUKO_AUTH_ENDPOINT: ${{ secrets.BUKO_AUTH_ENDPOINT }}
        run: |
          set -euo pipefail
          AUTH_ENDPOINT="${BUKO_AUTH_ENDPOINT:-https://buko-auth-worker.buko-auth.workers.dev}"
          printf '%s' "$AUTH_ENDPOINT" | grep -Eq '^https://[^[:space:]]+$'
          echo "BUKO_AUTH_ENDPOINT=$AUTH_ENDPOINT" >> "$GITHUB_ENV"

      - name: Validate Firebase Auth API key
        run: |
          set -euo pipefail
          API_KEY='AIzaSyAtClN06FLtjOaMDzLnJeYspEIqTtV0Xj0'
          RESPONSE=$(curl -sS -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary '{"token":"BUKO_INVALID_TEST_TOKEN","returnSecureToken":true}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q 'INVALID_CUSTOM_TOKEN'

      - name: Build release APK
        run: flutter build apk --release --dart-define=BUKO_AUTH_ENDPOINT="$BUKO_AUTH_ENDPOINT"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUKO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
